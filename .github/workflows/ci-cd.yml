name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Terraform Init
      run: terraform init

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      run: terraform plan -out=tfplan

    - name: Unit Tests (Terratest)
      run: go test -v ./tests/...

  canary-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Deploy Canary Environment
      run: |
        terraform apply -var="env=canary" -auto-approve

    - name: Validate Canary Tests
      run: ./scripts/run_canary_tests.sh

    - name: Promote Canary to Production (Manual Approval)
      uses: hmarr/auto-approve-action@v2
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
      if: success()